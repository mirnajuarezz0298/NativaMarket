<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NativaMarket — Carrito</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    :root { --nm-primary: #4A2545; --nm-accent: #C06C84; --nm-bg: #F7F0F5; }
    body { background-color: var(--nm-bg); font-family: 'Karla', sans-serif; color: #2E2630; }
    h1, h2, h3, h4, h5, .navbar-brand { font-family: 'Libre Baskerville', serif; }
    .navbar-nm { background-color: var(--nm-primary); }
    .navbar-nm .navbar-brand, .navbar-nm .nav-link { color: var(--nm-bg); }
    .navbar-nm .nav-link:hover { color: #fff; }
    .price { color: var(--nm-accent); font-family: 'Libre Baskerville', serif; font-weight: 700; }
    .btn-nm { background-color: var(--nm-accent); border-color: var(--nm-accent); color: #fff; }
    .btn-nm:hover { background-color: #a85870; border-color: #a85870; color: #fff; }
    .card-nm { background:#fff; border:none; border-radius:14px; }
    footer { background: var(--nm-primary); color: var(--nm-bg); }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-nm py-3">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="index.html"><img src="logo.svg" alt="" width="30" height="30">NativaMarket</a>
      <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="index.html#catalogo">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="aviso.html"><i class="bi bi-bell"></i> Avísame</a></li>
          <li class="nav-item"><a class="nav-link active" href="carrito.html"><i class="bi bi-cart3"></i> Carrito <span id="cart-count" class="badge bg-light text-dark" style="display:none">0</span></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="mb-4" style="color:var(--nm-primary)">Tu carrito</h1>
    <div class="row g-4">
      <div class="col-12 col-lg-8">
        <div id="items"></div>
      </div>
      <div class="col-12 col-lg-4">
        <div class="card-nm shadow-sm p-4" id="resumen"></div>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-4">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <span class="fw-semibold">NativaMarket</span>
      <small>Lo hecho en Guatemala, reunido en un solo lugar.</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="cart.js"></script>
  <script>
    function render() {
      const items = getCart();
      const cont = document.getElementById('items');
      const resumen = document.getElementById('resumen');

      if (items.length === 0) {
        cont.innerHTML = `<div class="card-nm shadow-sm p-5 text-center">
          <p class="fs-5 mb-3" style="font-family:'Libre Baskerville',serif;color:var(--nm-primary)">Tu carrito está vacío</p>
          <p class="text-muted mb-4">Agrega productos hechos en Guatemala desde el catálogo.</p>
          <a href="index.html#catalogo" class="btn btn-nm px-4">Ir al catálogo</a>
        </div>`;
        resumen.innerHTML = '';
        return;
      }

      cont.innerHTML = items.map(x => `
        <div class="card-nm shadow-sm p-3 mb-3 d-flex flex-row align-items-center justify-content-between">
          <div>
            <div class="fw-semibold">${x.name}</div>
            <div class="text-muted small">Q${x.price.toFixed(2)} c/u</div>
          </div>
          <div class="d-flex align-items-center gap-3">
            <div class="input-group input-group-sm" style="width:120px">
              <button class="btn btn-outline-secondary" onclick="cambiar(${x.id}, ${x.qty - 1})">−</button>
              <input class="form-control text-center" value="${x.qty}" readonly>
              <button class="btn btn-outline-secondary" onclick="cambiar(${x.id}, ${x.qty + 1})">+</button>
            </div>
            <span class="price">Q${(x.price * x.qty).toFixed(2)}</span>
            <button class="btn btn-link text-danger p-0" title="Quitar" onclick="quitar(${x.id})"><i class="bi bi-trash"></i></button>
          </div>
        </div>`).join('');

      resumen.innerHTML = `
        <h5 class="mb-3" style="color:var(--nm-primary)">Resumen</h5>
        <div class="d-flex justify-content-between mb-2"><span>Subtotal</span><span>Q${cartSubtotal().toFixed(2)}</span></div>
        <div class="d-flex justify-content-between mb-2"><span>Envío</span><span>Q${ENVIO.toFixed(2)}</span></div>
        <hr>
        <div class="d-flex justify-content-between mb-3 fs-5"><span class="fw-semibold">Total</span><span class="price">Q${cartTotal().toFixed(2)}</span></div>
        <a href="checkout.html" class="btn btn-nm w-100">Continuar al pago</a>`;
    }

    function cambiar(id, qty) {
      if (qty < 1) { quitar(id); return; }
      setQty(id, qty); render();
    }
    function quitar(id) { removeFromCart(id); render(); }

    render();
  </script>
</body>
</html>
