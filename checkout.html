<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NativaMarket — Checkout</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    :root { --nm-primary: #4A2545; --nm-accent: #C06C84; --nm-bg: #F7F0F5; }
    body { background-color: var(--nm-bg); font-family: 'Karla', sans-serif; color: #2E2630; }
    h1, h2, h3, h4, h5, .navbar-brand { font-family: 'Libre Baskerville', serif; }
    .navbar-nm { background-color: var(--nm-primary); }
    .navbar-nm .navbar-brand, .navbar-nm .nav-link { color: var(--nm-bg); }
    .navbar-nm .nav-link:hover { color: #fff; }
    .price { color: var(--nm-accent); font-family: 'Libre Baskerville', serif; font-weight: 700; }
    .btn-nm { background-color: var(--nm-accent); border-color: var(--nm-accent); color: #fff; }
    .btn-nm:hover { background-color: #a85870; border-color: #a85870; color: #fff; }
    .form-control:focus { border-color: var(--nm-accent); box-shadow: 0 0 0 .2rem rgba(192,108,132,.20); }
    .card-nm { background:#fff; border:none; border-radius:14px; }
    .folio-box { background:#EFE1EA; border-radius:14px; }
    footer { background: var(--nm-primary); color: var(--nm-bg); }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-nm py-3">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4 d-flex align-items-center gap-2" href="index.html"><img src="logo.svg" alt="" width="30" height="30">NativaMarket</a>
      <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item"><a class="nav-link" href="index.html#catalogo">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" href="aviso.html"><i class="bi bi-bell"></i> Avísame</a></li>
          <li class="nav-item"><a class="nav-link" href="carrito.html"><i class="bi bi-cart3"></i> Carrito <span id="cart-count" class="badge bg-light text-dark" style="display:none">0</span></a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div id="contenido"></div>
  </main>

  <footer class="py-4 mt-4">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <span class="fw-semibold">NativaMarket</span>
      <small>Lo hecho en Guatemala, reunido en un solo lugar.</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="cart.js"></script>
  <script>
    const cont = document.getElementById('contenido');

    function vacio() {
      cont.innerHTML = `<div class="card-nm shadow-sm p-5 text-center">
        <p class="fs-5 mb-3" style="font-family:'Libre Baskerville',serif;color:var(--nm-primary)">No hay nada que pagar</p>
        <p class="text-muted mb-4">Tu carrito está vacío.</p>
        <a href="index.html#catalogo" class="btn btn-nm px-4">Ir al catálogo</a>
      </div>`;
    }

    function formulario() {
      const items = getCart();
      cont.innerHTML = `
        <a href="carrito.html" class="d-inline-block mb-4" style="color:var(--nm-primary);font-weight:600;text-decoration:none">← Volver al carrito</a>
        <h1 class="mb-4" style="color:var(--nm-primary)">Confirmar pedido</h1>
        <div class="row g-4">
          <div class="col-12 col-lg-7">
            <div class="card-nm shadow-sm p-4">
              <h5 class="mb-3" style="color:var(--nm-primary)">Datos de entrega</h5>
              <form id="form-checkout">
                <div class="mb-3"><label class="form-label fw-semibold">Nombre</label>
                  <input type="text" class="form-control" id="nombre" required></div>
                <div class="mb-3"><label class="form-label fw-semibold">Teléfono</label>
                  <input type="text" class="form-control" id="telefono" required></div>
                <div class="mb-3"><label class="form-label fw-semibold">Dirección de entrega</label>
                  <textarea class="form-control" id="direccion" rows="2" required></textarea></div>
                <button type="submit" class="btn btn-nm px-4" id="btn-confirmar">Confirmar pedido</button>
              </form>
              <div id="mensaje" class="mt-3"></div>
            </div>
          </div>
          <div class="col-12 col-lg-5">
            <div class="card-nm shadow-sm p-4">
              <h5 class="mb-3" style="color:var(--nm-primary)">Tu pedido</h5>
              ${items.map(x => `<div class="d-flex justify-content-between mb-2"><span>${x.qty} × ${x.name}</span><span>Q${(x.price*x.qty).toFixed(2)}</span></div>`).join('')}
              <div class="d-flex justify-content-between mb-2 text-muted"><span>Envío</span><span>Q${ENVIO.toFixed(2)}</span></div>
              <hr>
              <div class="d-flex justify-content-between fs-5"><span class="fw-semibold">Total</span><span class="price">Q${cartTotal().toFixed(2)}</span></div>
            </div>
          </div>
        </div>`;

      document.getElementById('form-checkout').addEventListener('submit', enviar);
    }

    async function enviar(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-confirmar');
      const mensaje = document.getElementById('mensaje');
      mensaje.innerHTML = '';
      btn.disabled = true;

      const pedido = {
        nombre: document.getElementById('nombre').value.trim(),
        telefono: document.getElementById('telefono').value.trim(),
        direccion: document.getElementById('direccion').value.trim(),
        resumen_pedido: cartResumen(),
        envio: ENVIO,
        total: cartTotal()
      };

      try {
        const resp = await fetch('/api/crear-pedido', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(pedido)
        });
        if (!resp.ok) {
          const data = await resp.json().catch(() => ({}));
          throw new Error(data.error || `Error ${resp.status}`);
        }
        const data = await resp.json();
        clearCart();
        // La confirmación muestra el folio y el estado que devolvió la función,
        // sin volver a consultar la base de datos.
        confirmacion(data.folio, data.estado);
      } catch (err) {
        btn.disabled = false;
        mensaje.innerHTML = `<div class="alert alert-danger mb-0">No se pudo confirmar el pedido: ${err.message}</div>`;
      }
    }

    function confirmacion(folio, estado) {
      cont.innerHTML = `
        <div class="folio-box p-5 text-center">
          <i class="bi bi-check-circle-fill" style="font-size:3rem;color:var(--nm-accent)"></i>
          <h1 class="mt-3" style="color:var(--nm-primary)">¡Gracias por tu pedido!</h1>
          <p class="text-muted mb-4">Guardamos tu pedido y te contactaremos para coordinar la entrega.</p>
          <div class="d-inline-flex flex-column flex-sm-row gap-4 justify-content-center bg-white rounded-3 px-4 py-3">
            <div><div class="text-muted small">Número de pedido (folio)</div><div class="price fs-4">#${folio}</div></div>
            <div><div class="text-muted small">Estado</div><div class="fs-4" style="font-family:'Libre Baskerville',serif;color:var(--nm-primary)">${estado}</div></div>
          </div>
          <div class="mt-4"><a href="index.html#catalogo" class="btn btn-nm px-4">Seguir comprando</a></div>
        </div>`;
    }

    if (getCart().length === 0) { vacio(); } else { formulario(); }
  </script>
</body>
</html>
